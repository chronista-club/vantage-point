name: CI

on:
  push:
    branches: [main, nightly, feat/*]
  pull_request:
    branches: [main, nightly]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ===========================================
  # フォーマットチェック（プラットフォーム非依存）
  # ===========================================
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96 # = .mise.toml [tools].rust (基本 stable 追随、 minor pin・patch float)
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  # ===========================================
  # Clippy + テスト（macOS — wry/tao が macOS API に依存）
  # ===========================================
  check:
    name: Clippy + Test
    runs-on: macos-latest
    steps:
      # font (.ttf) は通常 git blob 管理に移行済 (LFS budget 超過のため)。
      # checkout はデフォルトで font 実体がそのまま取れる (lfs フェッチ不要)。
      - uses: actions/checkout@v4

      # VP-180 (2026-05-15) で導入: club-unison v0.7.0+ の build script が protoc を要求
      # (= buffa::Message / ProtoCodec を生成するため、 v0.9 の wire format pivot 以降は
      # buffa-build が主役)。 macOS GHA runner には未インストールのため brew で入れる必要。
      - name: Install protoc (for club-unison build script)
        run: brew install protobuf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96 # = .mise.toml [tools].rust (基本 stable 追随、 minor pin・patch float)
        with:
          # rustfmt は agent_tools_codegen.rs の test が生成物整形に使う（Format job と同じく必要）。
          # 欠落していると rustfmt shim が非ゼロ終了し codegen test がパニック（#625 以来の CI 赤）。
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # webview bundle は gitignore の生成物 (2026-07-19 に commit 運用を廃止)。
      # vp-app の include_str! (main_area.rs) が要求するため cargo の前に生成する
      # (ローカルの正は `mise run app:bundle` — CI に mise が無いので同内容を直接実行)。
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build webview bundle
        working-directory: crates/vp-app/webview
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Test and typecheck webview
        working-directory: crates/vp-app/webview
        run: |
          bun run test
          bun run typecheck

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        # vp-nexus の auth_endpoint integration test は `test-utils` feature が required
        # (= install_test_jwks は production binary に含めない security 要件)。
        # 他 crate に test-utils feature がなくても無視されるので workspace 全体で OK。
        run: cargo test --workspace --features vp-nexus/test-utils

      # Tests regenerate KDL and ts-rs bindings. Any drift invalidates the bundle
      # built above; fail instead of accepting a build made from stale contracts.
      - name: Check generated files are committed
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"

  # ===========================================
  # Windows ビルド check（VP-87 Phase W0）
  # cargo check のみ。clippy / test は後続 Phase で追加
  # -D warnings は一旦外す（Phase W1 以降で段階的に warning 0 化）
  # ===========================================
  check-windows:
    name: Check (Windows)
    runs-on: windows-latest
    # Windows 能動開発 (2026-07-05: dogfood + daemon 常駐化 #669) に伴い PR でも検証する。
    # PR (nightly/main 宛) + main/nightly push で走らせ、 feat/* push は skip (PR 前段のため)。
    # 旧: main push のみ (2026-05-01 の CI 時間短縮、 Windows backlog 時の設定)。
    # cargo check --all-targets は test target も compile するので cfg(windows) コードの
    # compile regression を PR 段階で検出できる (clippy/test on Windows は後続 Phase)。
    # branch protection は optional のまま (Format + Clippy + Test のみ required) = 可視化目的。
    if: >-
      github.event_name == 'pull_request' ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/nightly'
    steps:
      - uses: actions/checkout@v4

      # VP-180 で導入: club-unison v0.7.0+ の build script が protoc を要求 (buffa-build 経由)
      - name: Install protoc (for club-unison build script)
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96 # = .mise.toml [tools].rust (基本 stable 追随、 minor pin・patch float)

      - uses: Swatinem/rust-cache@v2

      # webview bundle は gitignore の生成物 — vp-app の include_str! が要求 (check job と同様)。
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build webview bundle
        working-directory: crates/vp-app/webview
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Cargo check
        run: cargo check --workspace --all-targets

  # ===========================================
  # セキュリティ監査（依存クレートの既知脆弱性チェック）
  # 既知の許容済みアドバイザリは .cargo/audit.toml (SSOT) で管理
  # 新規の脆弱性が混入した場合にCIが失敗する
  # ===========================================
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run security audit
        # ignore リストは .cargo/audit.toml (SSOT) で管理。cargo-audit が CWD の
        # .cargo/audit.toml を自動読込するため、--ignore flag の羅列は不要。
        run: cargo audit
