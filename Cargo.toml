[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.17.0"
edition = "2024"
authors = ["Chronista Club"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/chronista-club/vantage-point"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# CLI
clap = { version = "4", features = ["derive"] }

# HTTP server
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "2"
anyhow = "1"

# HTTP client
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "blocking", "http2", "rustls"] }

# Async streams
futures = "0.3"
tokio-stream = "0.1"

# QUIC protocol。 crates.io package = `club-unison`、 Rust 識別子は `unison` に alias
# (VP-185: `package` rename で短い識別子を使う、 VP-180 以前の `unison::` 命名に回帰)。
# v0.8 Builder API / v0.9 wire format pivot (rkyv → buffa) / v0.10 datagram channel。
# v1.0.0-rc.1 (VP wiremsg Stage 1 で bump)。
unison = { package = "club-unison", version = "1.0.0-rc.1" }

# KDL parsing (club-kdl、 旧 unison-kdl。 v0.5.0 で rename + crates.io 移行)
club-kdl = "0.5"

# Glob patterns (lane / Stone Free)
glob = "0.3"

# TUI
ratatui = { version = "0.30", features = ["crossterm"] }
crossterm = "0.29"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
rusqlite = { version = "0.39", features = ["bundled"] }
surrealdb = { version = "3.0", default-features = false, features = ["kv-mem", "kv-surrealkv"] }

