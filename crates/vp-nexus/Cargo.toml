[package]
name = "vp-nexus"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "VP federation hub — nexus.vantage-point.app server (wiremsg cross-device 中継 / user 設定 sync / LAN 越え announce の起点)"

[[bin]]
name = "nexus"
path = "src/main.rs"

[lib]
name = "vp_nexus"
path = "src/lib.rs"

[[test]]
name = "auth_endpoint"
# install_test_jwks (= JWKS cache を任意置換できる API、 production exposed なら認証 bypass)
# を呼ぶ integration test。 production binary には絶対に含めないため、 自己 crate の
# `test-utils` feature を required にする (= CI / 開発者は --features vp-nexus/test-utils
# を渡して initialize する、 default では skip)。
required-features = ["test-utils"]

[[test]]
name = "oauth_flow"
# dogfood 5 retro N11 を最初から適用: OAuth flow の integration test も test-utils
# feature で gate。 install_test_jwks を使うわけではないが、 将来 mock OAuth server
# 用 helper を追加するときに同じ規律 (= production binary に test 用 symbol を含めない)
# を最初から守るため。
required-features = ["test-utils"]

[features]
default = []
# test 専用 API (= install_test_jwks 等) を expose する feature。 production build で
# 絶対に有効化しない。 CI workflow の test step が --features vp-nexus/test-utils を渡す。
test-utils = []

[dependencies]
# 設計方針: vantage-point crate (= 重量 daemon、 SurrealDB / wry / midir 含む) には
# 意図的に依存しない (= 独立 deploy 可能、 vp daemon が居なくても動く)。
# 原則 workspace.dependencies のみで完結させる、 vp-nexus 固有 (= JWT auth 等) は
# 専用 dep として追加。
axum = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
# Phase A1a (= dogfood 4): Creo ID JWT verify middleware 用。
# - jsonwebtoken: JWT decode/verify (RS256 + JWKS 対応)、 vp-nexus 専用
# - reqwest: JWKS fetch (workspace dep を再利用)
jsonwebtoken = "9"
reqwest = { workspace = true }
# Phase A1c (= dogfood 6): OAuth Authorization Code + PKCE flow (RFC 7636) 用。
# - sha2: PKCE code_challenge (= SHA-256(verifier) → base64url) 計算
# - rand: PKCE verifier + CSRF state の高エントロピー生成 (= OsRng)
# - base64: challenge の URL-safe base64 (no pad) encoding
# - url: authorize URL の query string 構築 (= form_urlencoded::Serializer)
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
url = "2"

[dev-dependencies]
# integration test 用 (= tower::ServiceExt::oneshot pattern、 別 server 起動不要)
http-body-util = "0.1"
# Phase A1a JWT verify middleware の unit test 用 (= test 用 RSA keypair 生成 + JWK 構築)
rsa = "0.9"
