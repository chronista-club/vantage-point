[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.28.0"
edition = "2024"
rust-version = "1.96" # = .mise.toml [tools].rust (基本 stable 追随、 minor pin)
authors = ["Chronista Club"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/chronista-club/vantage-point"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# CLI
clap = { version = "4", features = ["derive"] }

# HTTP server
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "2"
anyhow = "1"

# HTTP client
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "blocking", "http2", "rustls"] }

# Async streams
futures = "0.3"
tokio-stream = "0.1"

# QUIC protocol。 crates.io package = `club-unison`、 Rust 識別子は `unison` に alias
# (VP-185: `package` rename で短い識別子を使う、 VP-180 以前の `unison::` 命名に回帰)。
# v0.8 Builder API / v0.9 wire format pivot (rkyv → buffa) / v0.10 datagram channel。
# v1.0.0-rc.1 (VP wiremsg Stage 1 で bump)。
# v1.1.0 (Phase A3a で bump): DynamicProtocol (= runtime schema discovery) +
# ProtocolServer::enable_discovery が 1.1.0 で追加。 nexus settings sync で使う。
# minor bump (= backward-compatible)、 workspace 全 member (vp-app/vantage-point) も 1.1.0 に上がる。
# v1.3.0 (Swift menu bar agent で bump): raw QUIC に ALPN "unison" 追加 (#74, RFC 9001 準拠) +
# Swift client SDK live interop。 Apple の NWProtocolQUIC と QUIC handshake で握るには daemon も
# 同じ ALPN を喋る必要があり、 ALPN は 1.3.0 から。 server API (QuicServer/with_identity) は非破壊。
# 1.4.0: connection-level auth primitive (mechanism/policy 分離、 verifier/principal)。 federation
# (ADR-020 S1 cert / S3 discovery auth) の前提。 auth は opt-in (connect_with_credential)、 既存 API 非破壊。
# 1.5.0 (federation S4 relay で bump): server-initiated stream primitive
# (`register_server_channel` / `open_server_stream`)。 hub の relay floor (source→target を
# 片方向 forward) が依存。 VP の dialer + target inbound (③) がこれを使う。 既存 API 非破壊 (additive)。
unison = { package = "club-unison", version = "1.5.0" }

# Lifecycle / Outcome / drive primitives。 crates.io package = `club-nostos`、 Rust 識別子は
# `nostos` に alias (unison と同じ package rename 方針)。 doc 24 §4.6 lifecycle co-evolution:
# まず lane::commands の worktree add retry が sync `Outcome` / `drive_bounded` の最初の consumer
# (2026-06-20)。 async 拡張 (destroy-side reclaim) は upstream 0.2.0 で足して bump する想定。
nostos = { package = "club-nostos", version = "0.2" }

# KDL parsing (club-kdl、 旧 unison-kdl。 v0.5.0 で rename + crates.io 移行)
club-kdl = "0.11"

# Glob patterns (lane / Stone Free)
glob = "0.3"

# TUI
ratatui = { version = "0.30", features = ["crossterm"] }
crossterm = "0.29"

# Database (DB は SurrealDB に一本化、 sqlx / rusqlite は dead dep として撤去 — PR 457)
surrealdb = { version = "3.1", default-features = false, features = ["kv-mem", "kv-surrealkv"] }

