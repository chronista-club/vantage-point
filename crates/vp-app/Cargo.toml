[package]
name = "vp-app"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Vantage Point native app — Rust-native window/tray/menu over daemon"

[[bin]]
name = "vp-app"
path = "src/main.rs"

[lib]
name = "vp_app"
path = "src/lib.rs"

[dependencies]
# Async runtime
tokio = { workspace = true }

# Path / zone 解決 (XDG SSOT、 vantage-point と共有)。 旧 src/paths.rs の複製を
# 一本化 (Stage 3)。 重量 crate (vantage-point) に依存せず軽量 crate のみ引く。
vp-paths = { path = "../vp-paths" }

# Native window + WebView (crossplat: macOS/Windows/Linux)
# Phase 5-C (2026-04-28): wry 0.54 → 0.55 (custom protocol + WKWebView origin handling 改善期待)、tao 0.34 → 0.35
wry = { version = "0.56", features = ["devtools"] }
tao = "0.37"

# Menu + tray (crossplat)
muda = "0.19"
tray-icon = "0.24"

# HTTP client (daemon API)
reqwest = { workspace = true }

# pp-content-persist(当時の epic 名): board state ask の query encode (lane / pane_id)
urlencoding = "2"

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Toast notifications (crossplat; WinRT on Windows, libnotify on Linux, NSUserNotificationCenter on macOS)
notify-rust = "4"

# PTY (pseudo-terminal) for shell sessions — ConPTY on Windows, forkpty on Unix
portable-pty = "0.9"

# Base64 encoding (for PTY binary I/O over wry IPC)
base64 = "0.23"

# VP_SHELL_ARGS のシェル風クォート split
shell-words = "1.1"

# VP-93 Step 2a: daemon 経由 terminal (WebSocket client)
tokio-tungstenite = "0.30"
futures-util = "0.3"

# wiremsg Stage 1 consumer: repo の "lanes" Unison channel を QUIC 購読する。
# workspace 共有 (vantage-point server crate と同一版)。設計 mem_1CbA198fsHJsoKpu2jDUCv。
unison = { workspace = true }

# QUIC (unison) が使う rustls の CryptoProvider をプロセス起動時に install するため
# 直接依存させる。vp-cli / vantage-point と同じく aws-lc-rs provider を使う。
rustls = { version = "0.23", features = ["aws-lc-rs"] }

# Terminal clipboard (native OS clipboard fallback for WebView2)
arboard = "3"

# Pane id 用 UUID (VP-95)
uuid = { version = "1", features = ["v4", "serde"] }

# Settings 永続化 (VP-100 follow-up: 開発者モード等)
toml = "1.1"
dirs = "6"

# 構造化ログ用 timestamp (KDL 1-line formatter)
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Log file writer + ローテーション (Win GUI subsystem では stderr が NUL 化することがあるので file に直接書く)。
# file-rotate: 容量/件数ベースのローテーション。 現行ファイルは bare 名 (app.kdl.log) を維持し、
# rotate された世代を app.kdl.log.1.. に逃がす (日付名にしない = tail -F / 既存 reader を壊さない)。
file-rotate = "0.8"

# Native folder picker (repo 追加用、cross-platform)
rfd = "0.17"

# Sidebar File Explorer (overlay picker): lane workdir を walk して .gitignore を
# 尊重した entries を列挙するために使う。 WalkBuilder で hidden / .gitignore /
# .git/exclude をデフォルト除外、 target / node_modules 等は post-filter で潰す。
ignore = "0.4"

# console (xterm) の URL を OS default browser で開く。 WebLinksAddon の cmd/ctrl+click
# → `open-url` IPC → terminal::handle_ipc_message で webbrowser::open。 webview 内遷移
# (window.open) を避けるための native open 経路。 vantage-point auth.rs と同じ crate に揃える。
webbrowser = "1"

# assets/icon.png を runtime に RGBA へ decode する (tray icon / window icon が生 RGBA を要求)。
# png decode しかしないので default-features を切って軽量に保つ。
image = { version = "0.25", default-features = false, features = ["png"] }

# Phase 5-D fix: daemon_launcher で setsid(2) を呼ぶため (Unix で daemon を真の daemon 化、
#  vp-app 死亡時に SIGHUP 巻き添えで daemon も死ぬ問題の修正)。
# **重要**: target-specific section は file 末尾に置くこと。 途中に置くと TOML 仕様で
# 後続の dep declaration が全部この target に吸い込まれる (Windows CI で chrono/rfd/
# tracing-appender が Unix-only と解釈される bug を 2026-04-29 観測、 末尾移動で修正)。
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# runtime dock icon (NSApplication.setApplicationIconImage) — bare binary (`vp app start`) でも
# portal favicon を dock に当てる。 版は tao 0.35 が使う objc2 stack に合わせる (重複回避)。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# NSBitmapImageRep = ink（対話面, doc 52 §3）の NSImage → PNG 変換。版は上記 objc2 0.6 stack に合わせる。
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage", "NSResponder", "NSBitmapImageRep"] }
objc2-foundation = { version = "0.3", features = ["NSData"] }
# ink snapshot: WKWebView.takeSnapshot(rect) で board pane を PNG 化（ink_snapshot.rs）。
# block2 = completion handler / objc2-core-foundation = CGRect / objc2-app-kit = NSImage 返り値。
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKSnapshotConfiguration", "block2", "objc2-core-foundation", "objc2-app-kit"] }
objc2-core-foundation = { version = "0.3", features = ["CFCGTypes"] }
block2 = "0.6"

[dev-dependencies]
tempfile = "3"

# v1.0 柱 2 PR-1: Rust → TS 型生成 (sidebar SolidJS bundle 用)。
# dev-dependency に置き、 `#[cfg_attr(test, derive(TS), ...)]` で test build 時のみ
# `TS` derive を効かせる。 binding 出力は `cargo test -p vp-app` の export test 経由。
# `serde-compat` で `#[serde(...)]` attribute (rename_all / alias / default) を尊重する。
ts-rs = { version = "12", features = ["serde-compat"] }  # 12 で export_all() に Config 必須化 → pane.rs の export test は Config::from_env() で TS_RS_EXPORT_DIR を効かせる (2026-09-02)

# VP-208 Phase A: sidebar IPC を KDL protocol schema (schema/vp-sidebar.kdl) を
# SSOT に Rust enum + TS union 生成。 package 名 `club-kdl-codegen` / lib 名 `kdl_codegen`。
# 生成は `cargo test -p vp-app --test sidebar_ipc_codegen` 経由 (ts-rs と同じ慣習)。
club-kdl-codegen = "0.12"

# AppUserModelID (taskbar identity) の設定に使う。 版は vantage-point と揃える (0.62)。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_UI_Shell"] }

# build.rs で exe に icon + VersionInfo を焼く (Windows のみ)。
# build-dependencies の cfg は **host** で評価される = Windows host の時だけ引く。
# build.rs 側も `#[cfg(windows)]` で揃えてあるので mac/Linux build は winresource を
# compile すらしない (Windows 対応で mac を退行させない)。
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
