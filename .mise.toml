# Vantage Point - mise Configuration
# https://mise.jdx.dev/

[tools]
rust = "1.95.0"
node = "22"
bun = "latest"

[env]
VANTAGE_ROOT = "{{config_root}}"
_.file = ".env"

# Windows host (MINGW64 / Git Bash) で task の `run` block を bash で実行する。
# default は cmd.exe で、`set -euo pipefail` 等の bash idiom が崩壊するため必須。
[settings]
windows_default_inline_shell_args = "bash -c"

[tasks.build]
description = "Build Rust crates"
run = "cargo build"

[tasks.test]
description = "Run tests"
run = "cargo test"

# Phase 3-C (2026-04-27) で削除:
#   [tasks.mac] / [tasks."app:swift"] / [tasks."mac:build"] / [tasks."mac:release"]
# Mac 主軸が vp-app (Rust GUI: wry+tao+xterm.js+creo-ui) に移行済 (mem_1CaSjEz55wBuy3JdU14LCS)、
# Swift app (apple/VantagePoint) も同時に削除。
#
# Naming history:
#   2026-05-02 PR #253 で `vp:app:*` / `vp:daemon:*` / `vp:sys:*` の `vp:` prefix 規約 (doc 11 §8) を導入
#   2026-05-07 で prefix を撤回、 `app:*` / `daemon:*` / `sys:*` に simplify (.mise.toml が project-scoped
#     で動く以上 vp: prefix 冗長、 user 体感 `mise run vp:app` → `mise run app` の短縮を優先)
# 2026-05-07 同時変更: cargo build → cargo install --path に切替、 binary は `~/.cargo/bin/` (PATH) に
#   配置して codesign 付与 + shell `vp` コマンドと mise task 系で source 共通化 (dual source drift 防止)。
# `mise run app` (Rust GUI) を使うこと。 注: `vp:stand:*` (file-based tasks at `.mise/tasks/vp/stand/`)
# は別系統で rename 対象外。 doc 11 で確立した init script chain を物理 path 含めて維持。

# =============================================================================
# app:* ─ GUI (vp-app crate: Rust + wry + xterm.js + creo-ui)
# =============================================================================
#
# 注意: vp-app は assets/ 以下の JS / xterm.js / main_area.rs 内 inline JS を
#   `include_str!` で binary に baked-in する build モデル。 ソース編集後は必ず
#   `mise run app:build` (or `mise run app`) を経由しないと反映されない。
#   `vp app stop && vp app start` の relaunch だけでは古いバイナリが走り続ける。

[tasks."app:build"]
description = "vp-app GUI binary を release build + ~/.cargo/bin に install (codesign 付与、 PATH 経由でも fresh)"
run = """
set -euo pipefail
echo "🔨 Building vp-app (release) + install to ~/.cargo/bin..."
# cargo install --path で codesign 付き binary を $CARGO_HOME/bin (PATH) に配置。
# cp だと codesign が剥がれて macOS に kill される (CLAUDE.md feedback 参照) ため install 経由必須。
# build artifact (target/) も副産物として生成される ─ shell の `vp` も `mise run` 系も同じ source。
cargo install --path crates/vp-app
echo "✅ Installed: $HOME/.cargo/bin/vp-app"
"""

[tasks."app:start"]
description = "vp-app GUI を起動 (`vp app start`、 spawn + 即 exit、 ~/.cargo/bin/vp{,-app} 前提)"
run = """
set -euo pipefail
VP_APP_BIN="$HOME/.cargo/bin/vp-app"
VP_BIN="$HOME/.cargo/bin/vp"
[ -x "$VP_APP_BIN" ] || { echo "❌ vp-app binary not found: $VP_APP_BIN — 先に 'mise run app:build'" >&2; exit 1; }
[ -x "$VP_BIN" ]     || { echo "❌ vp binary not found: $VP_BIN — 先に 'mise run daemon:build'" >&2; exit 1; }

# 2026-05-07 single source of truth 統一: `~/.cargo/bin/` の codesign 済 binary を使う
# (旧: target/release から spawn してたが、 shell の vp と dual source で drift する罠あり)。
# `vp app start` に VP_APP_BIN env で binary path を明示、 vp は spawn + 親即 exit。
# ログ観察は `mise run logs` で 3 file (daemon / app tracing / app stdout) を集約 tail。
exec env VP_APP_BIN="$VP_APP_BIN" "$VP_BIN" app start
"""

[tasks."app:stop"]
description = "vp-app GUI を停止 (`vp app stop` の thin wrapper、 daemon / tmux / SP は触らない)"
run = "exec $HOME/.cargo/bin/vp app stop"

[tasks."app"]
description = "vp-app を build → 既存 app stop → app start (daemon は touch しない、 daemon 再起動は `mise run daemon`)"
run = """
set -euo pipefail
mise run app:build
# stop は running 不在でも success にする (chain breaking 回避)
mise run app:stop 2>/dev/null || echo "(running app なし、 stop はスキップ)"
mise run app:start
"""

# =============================================================================
# daemon:* ─ daemon binary (vp-cli = vp binary、 TheWorld + CLI subcommands)
# =============================================================================
#
# `vp daemon start` は SP / tmux session の owner。 stop は cascade で背負ってる
# subsystem 全部 (SP プロセス + Lane tmux session + daemon 本体) を一括停止する。

[tasks."daemon:build"]
description = "vp binary (vp-cli: TheWorld daemon + CLI commands) を release build + ~/.cargo/bin に install"
run = """
set -euo pipefail
echo "🔨 Building vp-cli (vp binary) + install to ~/.cargo/bin..."
# cargo install --path で codesign 付きで $CARGO_HOME/bin に配置。
# shell `vp ps` 等と mise task 系で source 共通化、 dual source drift 防止。
cargo install --path crates/vp-cli
echo "✅ Installed: $HOME/.cargo/bin/vp"
"""

[tasks."daemon:start"]
description = "TheWorld daemon を background spawn (nohup detach、 task は即 exit、 log は logs task で tail)"
run = """
set -euo pipefail
LOG_DIR="${VP_LOG_DIR:-$HOME/Library/Logs/Vantage}"
mkdir -p "$LOG_DIR"
export VP_DAEMON_LOG_FILE="$LOG_DIR/daemon.kdl.log"
DAEMON_STDOUT_LOG="$LOG_DIR/daemon.stdout.log"
touch "$VP_DAEMON_LOG_FILE" "$DAEMON_STDOUT_LOG"

VP_BIN="$HOME/.cargo/bin/vp"
[ -x "$VP_BIN" ] || { echo "❌ vp binary not found: $VP_BIN — 先に 'mise run daemon:build'" >&2; exit 1; }

# 既存 daemon が居る場合は user が事前に `mise run daemon:stop` で止めるか、
# `vp daemon stop && mise run daemon:start` のように合成する。 restart は CLI に持たない方針
# (user 指示: 「restart いらない、 build -> start -> stop が cli で回ってから」 2026-04-30)。
#
# 2026-05-07 background detach 化 (旧: foreground blocking で task が log tail まで持っていた):
#   user 指示「task 自体はバックエンドで daemon 立てたら終了するようにして欲しい」
#   nohup + & + disown で controlling tty / parent process group から切り離して spawn、
#   structured log は VP_DAEMON_LOG_FILE (tracing 経由 KDL)、 stdout/stderr (panic 等) は別 file。
#   Log 観察は `mise run logs` で 3+1 file を tail。
echo "📝 daemon log: $VP_DAEMON_LOG_FILE"
echo "📝 daemon stdout: $DAEMON_STDOUT_LOG"
echo "🚀 Spawning daemon (nohup + disown、 task 即 exit)..."
nohup "$VP_BIN" daemon start </dev/null >>"$DAEMON_STDOUT_LOG" 2>&1 &
DAEMON_PID=$!
disown || true  # bash は内蔵、 sh だと no-op (失敗しても無視)
echo "✅ daemon spawned (PID=$DAEMON_PID)"
echo "ℹ️  tail: mise run logs"
"""

# tmux session は SP / daemon を kill しても tmux server に保持され続けるため、
# `tmux new-session -A -c {cwd}` で attach 経路に乗ると古い cwd を引き継ぐ罠がある。
# (commit 1556868 で `-c` を追加したが、 fix 適用前に作成済 session には反映されない)
# `daemon:stop` は SP / daemon に加えて Lane tmux session (vp-*/hd-*/th-* prefix) も kill して、
# 次回 `mise run app` で全 lane を fix 済 path で再生成させる。
# 対象外: TUI mode (`vp start`) が作る `{project}-vp` suffix 形式の session — `tmux.rs::session_name`
# が `start.rs` で `-c {project_dir}` 付きで作成しており、 cwd 継承罠の罹患対象ではないため。
[tasks."daemon:stop"]
description = "TheWorld daemon + 裏で動く SP プロセス + Lane tmux session を一括停止 (旧 nuke 相当)"
run = """
set -euo pipefail

VP_BIN="$HOME/.cargo/bin/vp"

echo "💣 Vantage Point daemon + 関連プロセス停止 (cascade kill)..."
echo ""

# ── [1/3] SP プロセスを kill (sys:sp-kill 同等処理を inline 展開) ──────────
echo "🔄 [1/3] 全 SP プロセス検出..."
SP_PIDS=$(pgrep -f 'vp sp start' 2>/dev/null || true)
if [ -z "$SP_PIDS" ]; then
  echo "   ℹ️  実行中の SP プロセスはありません"
else
  echo "   📋 検出した SP:"
  ps -p $SP_PIDS -o pid,etime,start,command 2>/dev/null | sed 's/^/      /' | head -20 || true
  echo "   🛑 SIGTERM 送信..."
  kill -TERM $SP_PIDS 2>/dev/null || true
  sleep 2
  REMAINING=$(pgrep -f 'vp sp start' 2>/dev/null || true)
  if [ -n "$REMAINING" ]; then
    echo "   🔨 残存に SIGKILL: $REMAINING"
    kill -KILL $REMAINING 2>/dev/null || true
    sleep 1
  fi
  echo "   ✅ SP kill 完了"
fi
echo ""

# ── [2/3] VP-managed tmux session を kill ─────────────────────────────────────
# 命名 convention (lanes_state.rs::tmux_session_name):
#   vp-{project}-{lane}-{stand}
#   e.g. vp-vantage-point-lead-hd, vp-vantage-point-sub-hd, vp-vp-lead-th
# `vp-` prefix で user 自前 tmux session (project 名そのまま等) と確実分離。
# 旧 prefix (hd-*/th-*) は legacy: rename 前に作成済 session の cleanup のため併記する
# (新形式では生成されないので残しても害なし、 migration 完了後も safe)。
echo "🔄 [2/3] VP-managed tmux session 検出 (vp-* prefix、 legacy hd-*/th-* 含む)..."
VP_SESSIONS=$(tmux list-sessions -F '#{session_name}' 2>/dev/null | grep -E '^(vp-|hd-|th-)' || true)
if [ -z "$VP_SESSIONS" ]; then
  echo "   ℹ️  VP-managed tmux session はありません"
else
  echo "   📋 kill 対象:"
  echo "$VP_SESSIONS" | sed 's/^/      /'
  echo "$VP_SESSIONS" | while IFS= read -r s; do
    [ -n "$s" ] && tmux kill-session -t "$s" 2>/dev/null || true
  done
  echo "   ✅ tmux session kill 完了"
fi
echo ""

# ── [3/3] TheWorld daemon を停止 ──────────────────────────────────────────────
echo "🔄 [3/3] TheWorld daemon 停止..."
if [ -x "$VP_BIN" ]; then
  "$VP_BIN" daemon stop 2>/dev/null && echo "   ✅ daemon stop 完了" \\
    || echo "   ℹ️  daemon は既に停止しているか、 reach 不能"
else
  echo "   ⚠️  vp binary 不在 ($VP_BIN) — daemon stop スキップ"
  echo "      build 済なら 'mise run daemon:build' 後に再実行してください"
fi
echo ""

echo "💥 daemon + 関連プロセス停止完了。"
echo "ℹ️  再起動: mise run app"
"""

[tasks."daemon"]
description = "vp binary を build → 既存 daemon を cascade stop → daemon を background spawn (full restart、 `mise run daemon && mise run app` で諸々再起動)"
run = """
set -euo pipefail
mise run daemon:build
# stop は running 不在でも success にする (chain breaking 回避)。
# daemon:stop は cascade kill = daemon + SP + Lane tmux session 全停止 (= 旧 nuke 相当)。
mise run daemon:stop 2>/dev/null || echo "(running daemon なし、 stop はスキップ)"
mise run daemon:start
"""

# 注: `app:restart` / `daemon:restart` という名前の task は意図的に提供しない。
# user 指示「restart いらない、 build -> start -> stop が cli で回ってから」 (2026-04-30)
# に従い、 top-level の `app` / `daemon` 自体が build→stop→start を内蔵する pattern に揃えた
# (2026-05-07)。 完全 fresh start は `mise run daemon && mise run app` で 2 command。

# =============================================================================
# sys:* ─ システム管理 (個別プロセスの sniper kill 系)
# =============================================================================
#
# `daemon:stop` は cascade kill (daemon + 全 SP + tmux)、 全停止用。
# 一方 `sys:sp-kill` は SP だけ叩き直す sniper kill。 daemon は維持したまま
# binary 入替後の re-register / ghost SP cleanup に使う (daemon 再起動は重い)。

[tasks."sys:sp-kill"]
description = "全 SP (vp sp start ...) を graceful kill (daemon は維持、 ghost SP cleanup や binary 入替時)"
run = """
set -euo pipefail
echo "🔄 全 SP プロセス検出..."

# vp sp start ... に matching する PID を列挙
SP_PIDS=$(pgrep -f 'vp sp start' 2>/dev/null || true)

if [ -z "$SP_PIDS" ]; then
  echo "ℹ️  実行中の SP プロセスはありません"
  exit 0
fi

echo "📋 検出した SP プロセス:"
ps -p $SP_PIDS -o pid,etime,start,command 2>/dev/null | head -20 || true

echo ""
echo "🛑 SIGTERM 送信 (graceful shutdown 経由で PtySlot Drop = child claude も kill)..."
kill -TERM $SP_PIDS 2>/dev/null || true

# graceful shutdown 待機 (claude CLI session save 等が走る時間)
sleep 2

# 残存 check
REMAINING=$(pgrep -f 'vp sp start' 2>/dev/null || true)
if [ -n "$REMAINING" ]; then
  echo "⚠️  graceful kill でも残存している SP があります: $REMAINING"
  echo "🔨 SIGKILL で強制終了..."
  kill -KILL $REMAINING 2>/dev/null || true
  sleep 1
fi

echo "✅ SP all-kill 完了"
echo ""
echo "ℹ️  TheWorld が動いていれば、 expand 等で auto-spawn が走り次回 register。"
echo "   完全 fresh start は: mise run daemon:stop && mise run app"
"""

# =============================================================================
# logs ─ daemon + vp-app の log を 4 file 同時 tail
# =============================================================================

[tasks.logs]
description = "Tail VP logs (daemon + daemon stdout + app tracing + app stdout) — terminal で常時 stream 表示"
run = """
set -euo pipefail
LOG_DIR="${VP_LOG_DIR:-$HOME/Library/Logs/Vantage}"
mkdir -p "$LOG_DIR"

# 必要な log file が無くてもエラーにならないように先に touch
# (新規 process が立ち上がる前に tail -F が file を見つけられるように)
touch "$LOG_DIR/daemon.kdl.log" "$LOG_DIR/daemon.stdout.log" "$LOG_DIR/app.kdl.log" "$LOG_DIR/app.stdout.log"

echo "📝 Tailing 4 files:"
echo "   daemon.kdl.log     (TheWorld + SP tracing、 KDL structured)"
echo "   daemon.stdout.log  (daemon stdout/stderr、 panic 等の chaotic 出力)"
echo "   app.kdl.log        (vp-app tracing、 KDL structured)"
echo "   app.stdout.log     (vp-app stdout/panic)"
echo "─────────────────────────────────────────────────"
exec tail -F "$LOG_DIR/daemon.kdl.log" "$LOG_DIR/daemon.stdout.log" "$LOG_DIR/app.kdl.log" "$LOG_DIR/app.stdout.log"
"""

[tasks.win]
description = "Build & run vp-app + vp (standalone) on Windows native (MINGW64 / Git Bash)"
run = '''
set -euo pipefail
ROOT="$(pwd)"

# scoop install mingw が bin を setx で User PATH 追加するが、起動済 shell には伝播しない。
# 既存 shell からでも task が動くよう、scoop mingw bin を明示的に PATH に prepend。
if [ -n "${USERPROFILE:-}" ]; then
  SCOOP_MINGW_BIN="$(cygpath -u "$USERPROFILE")/scoop/apps/mingw/current/bin"
  [ -d "$SCOOP_MINGW_BIN" ] && export PATH="$SCOOP_MINGW_BIN:$PATH"
fi

# 前提チェック (Windows native)
if ! command -v x86_64-w64-mingw32-gcc >/dev/null 2>&1; then
  echo "❌ mingw-w64 が未インストール: scoop install mingw" >&2
  exit 1
fi
if ! command -v nasm >/dev/null 2>&1; then
  echo "❌ nasm が未インストール (aws-lc-sys で必須): scoop install nasm" >&2
  exit 1
fi
if ! rustup target list --installed 2>/dev/null | grep -q "x86_64-pc-windows-gnu"; then
  echo "📦 rustup target 追加: x86_64-pc-windows-gnu"
  rustup target add x86_64-pc-windows-gnu
fi

if [ "${VP_SKIP_DAEMON_BUILD:-}" = "1" ]; then
  echo "🔨 vp-app のみ Windows 向けにビルド (VP_SKIP_DAEMON_BUILD=1)..."
  CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=x86_64-w64-mingw32-gcc \
    cargo build --target x86_64-pc-windows-gnu -p vp-app
else
  echo "🔨 vp-app + vp (vp-cli) を Windows 向けにビルド..."
  # vp-app: GUI app (tao + wry + WebView2)
  # vp (= vp-cli): TheWorld daemon 本体。Windows native では GUI/MIDI feature を落とす
  #   (gui feature は macOS/Linux の tao/muda、midi は ALSA 依存で Windows 経路と相性悪い)
  CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=x86_64-w64-mingw32-gcc \
    cargo build --target x86_64-pc-windows-gnu -p vp-app -p vp-cli --no-default-features
fi

VP_APP_EXE="$ROOT/target/x86_64-pc-windows-gnu/debug/vp-app.exe"
VP_EXE="$ROOT/target/x86_64-pc-windows-gnu/debug/vp.exe"
WEBVIEW2_DLL=$(find "$ROOT/target/x86_64-pc-windows-gnu/debug/build" -path "*/webview2-com-sys-*/out/x64/WebView2Loader.dll" -print -quit)
if [ -z "$WEBVIEW2_DLL" ] || [ ! -f "$VP_APP_EXE" ]; then
  echo "❌ build 成果物が見つからない (vp-app.exe / WebView2Loader.dll)" >&2
  exit 1
fi

# Windows 側のインストール先 (user-scope、LOCALAPPDATA 配下)。
# MINGW64 では $LOCALAPPDATA は Windows 形式 (C:\...) で auto-set されるので
# cygpath で unix 形式 / win 形式を相互変換する。
INSTALL_DIR=$(cygpath -u "$LOCALAPPDATA")/VantagePoint-dev
INSTALL_DIR_WIN=$(cygpath -w "$INSTALL_DIR")
INSTALL_EXE_WIN="$INSTALL_DIR_WIN\\vp-app.exe"

echo "🔄 既存プロセスを停止 (vp-app / vp の exe ロック解放)..."
powershell.exe -NoProfile -Command "Get-Process -Name vp-app,vp -ErrorAction SilentlyContinue | Stop-Process -Force" 2>/dev/null | tr -d '\r' || true
sleep 1

echo "📦 $INSTALL_DIR に vp-app.exe + WebView2Loader.dll$([ -f "$VP_EXE" ] && echo ' + vp.exe') を配置..."
mkdir -p "$INSTALL_DIR"
cp "$VP_APP_EXE" "$INSTALL_DIR/vp-app.exe"
cp "$WEBVIEW2_DLL" "$INSTALL_DIR/WebView2Loader.dll"
# vp.exe は VP_SKIP_DAEMON_BUILD=1 時にはビルドされていないので存在確認して copy
if [ -f "$VP_EXE" ]; then
  cp "$VP_EXE" "$INSTALL_DIR/vp.exe"
fi

# 任意 override
RUST_LOG_VAL="${RUST_LOG:-vp_app=info,vantage_point=info}"
VP_SHELL_VAL="${VP_SHELL:-}"
VP_SHELL_ARGS_VAL="${VP_SHELL_ARGS:-}"
VP_TERMINAL_MODE_VAL="${VP_TERMINAL_MODE:-}"
VP_WORLD_URL_VAL="${VP_WORLD_URL:-}"

# vp-app + vp.exe (daemon) は tracing-appender 経由で file に直接書く。
# - vp-app:  $LOCALAPPDATA\VantagePoint-dev\Logs\app.kdl.log (tracing-appender)
# - vp.exe:  $LOCALAPPDATA\VantagePoint-dev\Logs\daemon.kdl.log (VP_DAEMON_LOG_FILE 経由)
# Start-Process redirect は使わず (Win GUI subsystem では非機能)、各 process の file writer が source。
LOG_APP="$INSTALL_DIR/Logs/app.kdl.log"
LOG_DAEMON="$INSTALL_DIR/Logs/daemon.kdl.log"
LOG_DAEMON_WIN="$INSTALL_DIR_WIN\\Logs\\daemon.kdl.log"
mkdir -p "$INSTALL_DIR/Logs" 2>/dev/null || true
: > "$LOG_APP" 2>/dev/null || true
: > "$LOG_DAEMON" 2>/dev/null || true

echo "🚀 Launching $INSTALL_EXE_WIN ..."
WIN_PID=$(powershell.exe -NoProfile -Command "\$env:VP_SHELL='$VP_SHELL_VAL'; \$env:VP_SHELL_ARGS='$VP_SHELL_ARGS_VAL'; \$env:RUST_LOG='$RUST_LOG_VAL'; \$env:VP_TERMINAL_MODE='$VP_TERMINAL_MODE_VAL'; \$env:VP_WORLD_URL='$VP_WORLD_URL_VAL'; \$env:VP_DAEMON_LOG_FILE='$LOG_DAEMON_WIN'; Start-Process -FilePath '$INSTALL_EXE_WIN' -WorkingDirectory '$INSTALL_DIR_WIN' -PassThru | Select-Object -ExpandProperty Id" 2>&1 | tr -d '\r' | tr -d '[:space:]')
echo "✅ 起動完了 (PID=$WIN_PID)"
echo "   app log:    $LOG_APP"
echo "   daemon log: $LOG_DAEMON"
echo ""
echo "📺 ログを stdout に流します (Ctrl+C で tail 停止、vp-app は継続)..."
echo "─────────────────────────────────────────────────"

# vp-app + vp.exe (daemon) の 2 file を同時 tail。Windows native の NTFS file なので
# MINGW64 tail は polling で安定 follow できる。
tail -F --sleep-interval=0.5 "$LOG_APP" "$LOG_DAEMON" &
TAIL_PID=$!

# vp-app プロセス (Win-side PID) を tasklist.exe で監視、終了したら tail 止めて抜ける。
trap 'kill $TAIL_PID 2>/dev/null; echo ""; echo "📴 tail 停止 (vp-app は継続中)。再度開始: mise run win:logs"' EXIT INT TERM

while [ -n "$WIN_PID" ] && tasklist.exe /FI "PID eq $WIN_PID" 2>/dev/null | grep -q "$WIN_PID"; do
  sleep 1
done
echo ""
echo "🏁 vp-app (PID=$WIN_PID) 終了"
'''

[tasks."win:logs"]
description = "実行中の vp-app + vp.exe (daemon) の log を tail -F で stdout 表示"
run = '''
set -euo pipefail
INSTALL_DIR=$(cygpath -u "$LOCALAPPDATA")/VantagePoint-dev
LOG_APP="$INSTALL_DIR/Logs/app.kdl.log"
LOG_DAEMON="$INSTALL_DIR/Logs/daemon.kdl.log"

echo "📺 tail -F: $LOG_APP + $LOG_DAEMON"
echo "─────────────────────────────────────────────────"
exec tail -F --sleep-interval=0.5 "$LOG_APP" "$LOG_DAEMON"
'''

[tasks."win:build"]
description = "Build vp-app + vp for Windows native without launching (MINGW64 / Git Bash)"
run = """
set -euo pipefail
# scoop install mingw が bin を setx で追加するが既存 shell には伝播しないので明示的に prepend
if [ -n "${USERPROFILE:-}" ]; then
  SCOOP_MINGW_BIN="$(cygpath -u "$USERPROFILE")/scoop/apps/mingw/current/bin"
  [ -d "$SCOOP_MINGW_BIN" ] && export PATH="$SCOOP_MINGW_BIN:$PATH"
fi
if ! command -v x86_64-w64-mingw32-gcc >/dev/null 2>&1; then
  echo "❌ mingw-w64 が未インストール: scoop install mingw" >&2
  exit 1
fi
if ! command -v nasm >/dev/null 2>&1; then
  echo "❌ nasm が未インストール (aws-lc-sys で必須): scoop install nasm" >&2
  exit 1
fi
if ! rustup target list --installed 2>/dev/null | grep -q "x86_64-pc-windows-gnu"; then
  rustup target add x86_64-pc-windows-gnu
fi

CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=x86_64-w64-mingw32-gcc \
  cargo build --target x86_64-pc-windows-gnu -p vp-app -p vp-cli --no-default-features
echo "✅ Built: target/x86_64-pc-windows-gnu/debug/{vp-app,vp}.exe"
"""

[tasks."win:release"]
description = "Build vp-app + vp release for Windows native (MSI/署名/winget は Phase W4 で追加予定)"
run = """
set -euo pipefail
# scoop install mingw が bin を setx で追加するが既存 shell には伝播しないので明示的に prepend
if [ -n "${USERPROFILE:-}" ]; then
  SCOOP_MINGW_BIN="$(cygpath -u "$USERPROFILE")/scoop/apps/mingw/current/bin"
  [ -d "$SCOOP_MINGW_BIN" ] && export PATH="$SCOOP_MINGW_BIN:$PATH"
fi
if ! command -v x86_64-w64-mingw32-gcc >/dev/null 2>&1; then
  echo "❌ mingw-w64 が未インストール: scoop install mingw" >&2
  exit 1
fi
if ! command -v nasm >/dev/null 2>&1; then
  echo "❌ nasm が未インストール (aws-lc-sys で必須): scoop install nasm" >&2
  exit 1
fi
if ! rustup target list --installed 2>/dev/null | grep -q "x86_64-pc-windows-gnu"; then
  rustup target add x86_64-pc-windows-gnu
fi

CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=x86_64-w64-mingw32-gcc \
  cargo build --release --target x86_64-pc-windows-gnu -p vp-app -p vp-cli --no-default-features

VP_APP="target/x86_64-pc-windows-gnu/release/vp-app.exe"
VP_BIN="target/x86_64-pc-windows-gnu/release/vp.exe"
ls -lh "$VP_APP" "$VP_BIN"
echo "✅ Release built: $VP_APP + $VP_BIN"
echo "ℹ️  WiX MSI + Authenticode 署名 + winget manifest は Phase W4 (VP-90) で追加予定"
"""

# =============================================================================
# Release artifact push — workspace.package.version の tag (vX.Y.Z) に
# Mac / Win build artifact を upload する。
#
# 運用:
# 1. Cargo.toml で version を bump → main commit + tag push (release skill / 手動)
# 2. Mac で `mise run push:mac` → apple-silicon binary 群を release に upload
# 3. Win で `mise run push:win` → x86_64-pc-windows-gnu binary 群を release に upload
#
# release が無ければ最初の push:* で `gh release create`、 既存なら `--clobber` で
# 同名 asset 上書き (再 build/再 push 可能)。
# =============================================================================

[tasks."push:mac"]
description = "Mac silicon (vp + vp-app) を build して GitHub Release に artifact を upload"
run = '''
set -euo pipefail
ROOT="$(pwd)"

# version 取得 (workspace.package.version、 release: vX.Y.Z タグ形式)
VERSION=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
TAG="v$VERSION"
echo "📦 push:mac for $TAG"

# Build (apple-silicon、 vp = vp-cli、 vp-app = GUI)
echo "🔨 cargo build --release --target aarch64-apple-darwin -p vp-cli -p vp-app"
cargo build --release --target aarch64-apple-darwin -p vp-cli -p vp-app

VP="target/aarch64-apple-darwin/release/vp"
VP_APP="target/aarch64-apple-darwin/release/vp-app"
[ -x "$VP" ] || { echo "❌ vp binary not found at $VP" >&2; exit 1; }
[ -x "$VP_APP" ] || { echo "❌ vp-app binary not found at $VP_APP" >&2; exit 1; }

# Archive (tar.gz、 binary 2 つを target/aarch64-apple-darwin/release/ から直接 archive)
DIST="$ROOT/target/dist"
mkdir -p "$DIST"
ARCHIVE="$DIST/vp-$VERSION-aarch64-apple-darwin.tar.gz"
echo "📦 archive: $ARCHIVE"
tar czf "$ARCHIVE" -C "target/aarch64-apple-darwin/release" vp vp-app
ls -lh "$ARCHIVE"

# Upload (create release if missing、 既存なら --clobber で同名上書き)
if gh release view "$TAG" >/dev/null 2>&1; then
  echo "📤 upload to existing release $TAG (--clobber で同名 asset 上書き)"
  gh release upload "$TAG" "$ARCHIVE" --clobber
else
  echo "📦 create release $TAG with first asset"
  gh release create "$TAG" "$ARCHIVE" --title "$TAG" --generate-notes --latest
fi

echo "✅ pushed: $ARCHIVE → release $TAG"
'''

[tasks."push:win"]
description = "Windows native build (vp + vp-app + WebView2Loader.dll) を GitHub Release に upload — Windows machine 上で実行"
depends = ["win:release"]
run = '''
set -euo pipefail
ROOT="$(pwd)"

VERSION=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
TAG="v$VERSION"
echo "📦 push:win for $TAG (depends on win:release)"

VP_EXE="target/x86_64-pc-windows-gnu/release/vp.exe"
VP_APP_EXE="target/x86_64-pc-windows-gnu/release/vp-app.exe"
[ -f "$VP_EXE" ] || { echo "❌ vp.exe not found at $VP_EXE" >&2; exit 1; }
[ -f "$VP_APP_EXE" ] || { echo "❌ vp-app.exe not found at $VP_APP_EXE" >&2; exit 1; }

# WebView2Loader.dll (build script で生成、 path は webview2-com-sys-* hash 込み)
WEBVIEW2_DLL=$(find "target/x86_64-pc-windows-gnu/release/build" \
  -path "*/webview2-com-sys-*/out/x64/WebView2Loader.dll" -print -quit 2>/dev/null || true)
if [ -z "$WEBVIEW2_DLL" ] || [ ! -f "$WEBVIEW2_DLL" ]; then
  echo "❌ WebView2Loader.dll not found in target/x86_64-pc-windows-gnu/release/build" >&2
  exit 1
fi

# Archive (zip、 staging dir 経由で flat な構造に)
DIST="$ROOT/target/dist"
mkdir -p "$DIST"
ARCHIVE="$DIST/vp-$VERSION-x86_64-pc-windows-gnu.zip"
STAGING="$DIST/staging-win"
rm -rf "$STAGING"
mkdir -p "$STAGING"
cp "$VP_EXE" "$STAGING/"
cp "$VP_APP_EXE" "$STAGING/"
cp "$WEBVIEW2_DLL" "$STAGING/"
echo "📦 archive: $ARCHIVE"
(cd "$STAGING" && zip -q "$ARCHIVE" vp.exe vp-app.exe WebView2Loader.dll)
rm -rf "$STAGING"
ls -lh "$ARCHIVE"

# Upload (create release if missing、 既存なら --clobber)
if gh release view "$TAG" >/dev/null 2>&1; then
  echo "📤 upload to existing release $TAG (--clobber)"
  gh release upload "$TAG" "$ARCHIVE" --clobber
else
  echo "📦 create release $TAG with first asset"
  gh release create "$TAG" "$ARCHIVE" --title "$TAG" --generate-notes --latest
fi

echo "✅ pushed: $ARCHIVE → release $TAG"
'''
