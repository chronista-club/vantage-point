name: CI

on:
  push:
    branches: [main, nightly, feat/*]
  pull_request:
    branches: [main, nightly]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ===========================================
  # フォーマットチェック（プラットフォーム非依存）
  # ===========================================
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96 # = .mise.toml [tools].rust (基本 stable 追随、 minor pin・patch float)
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  # ===========================================
  # Clippy + テスト（macOS — wry/tao が macOS API に依存）
  # ===========================================
  check:
    name: Clippy + Test
    runs-on: macos-latest
    steps:
      # font (.ttf) は通常 git blob 管理に移行済 (LFS budget 超過のため)。
      # checkout はデフォルトで font 実体がそのまま取れる (lfs フェッチ不要)。
      - uses: actions/checkout@v4

      # VP-180 (2026-05-15) で導入: club-unison v0.7.0+ の build script が protoc を要求
      # (= buffa::Message / ProtoCodec を生成するため、 v0.9 の wire format pivot 以降は
      # buffa-build が主役)。 macOS GHA runner には未インストールのため brew で入れる必要。
      - name: Install protoc (for club-unison build script)
        run: brew install protobuf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96 # = .mise.toml [tools].rust (基本 stable 追随、 minor pin・patch float)
        with:
          # rustfmt は agent_tools_codegen.rs の test が生成物整形に使う（Format job と同じく必要）。
          # 欠落していると rustfmt shim が非ゼロ終了し codegen test がパニック（#625 以来の CI 赤）。
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        # vp-nexus の auth_endpoint integration test は `test-utils` feature が required
        # (= install_test_jwks は production binary に含めない security 要件)。
        # 他 crate に test-utils feature がなくても無視されるので workspace 全体で OK。
        run: cargo test --workspace --features vp-nexus/test-utils

  # ===========================================
  # Windows ビルド check（VP-87 Phase W0）
  # cargo check のみ。clippy / test は後続 Phase で追加
  # -D warnings は一旦外す（Phase W1 以降で段階的に warning 0 化）
  # ===========================================
  check-windows:
    name: Check (Windows)
    runs-on: windows-latest
    # CI 時間短縮 (2026-05-01): PR では skip、 main push (= merge 後 + 直 commit) のみで
    # regression 検証。 vp-app は Mac 主軸 (memory MEMORY.md "2026-04-26 移行") で
    # Windows backend (PR #219) は backlog 扱い。 branch protection は既に optional
    # (Format + Clippy + Test のみ required) なので merge blocking 影響なし。
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      # VP-180 で導入: club-unison v0.7.0+ の build script が protoc を要求 (buffa-build 経由)
      - name: Install protoc (for club-unison build script)
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96 # = .mise.toml [tools].rust (基本 stable 追随、 minor pin・patch float)

      - uses: Swatinem/rust-cache@v2

      - name: Cargo check
        run: cargo check --workspace --all-targets

  # ===========================================
  # セキュリティ監査（依存クレートの既知脆弱性チェック）
  # 既知の許容済みアドバイザリは .cargo/audit.toml (SSOT) で管理
  # 新規の脆弱性が混入した場合にCIが失敗する
  # ===========================================
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run security audit
        # ignore リストは .cargo/audit.toml (SSOT) で管理。cargo-audit が CWD の
        # .cargo/audit.toml を自動読込するため、--ignore flag の羅列は不要。
        run: cargo audit
