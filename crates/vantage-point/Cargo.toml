[package]
name = "vantage-point"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "AI-powered development platform with Agent and MIDI services"

[lib]
name = "vantage_point"
path = "src/lib.rs"

[features]
# Daemon-only build (Linux の GTK/ALSA 無し環境で通す) は
# `--no-default-features` で gui + midi を外す。
default = ["gui", "midi"]
gui = ["dep:tao", "dep:muda", "dep:tray-icon"]
midi = ["dep:midir", "dep:sha1"]

[dependencies]
# Async runtime
tokio = { workspace = true }
async-trait = { workspace = true }

# Path / zone 解決 (XDG SSOT、 vp-app と共有。 Stage 3 で config.rs から抽出)
vp-paths = { path = "../vp-paths" }

# Web server
axum = { workspace = true, features = ["ws"] }
tower-http = { workspace = true, features = ["fs", "cors"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# CLI
clap = { workspace = true }

# lane lib — Wing Lane 管理
club-kdl = { workspace = true }
glob = { workspace = true }

# lifecycle / Outcome / drive primitives (doc 24 §4.6、 worktree add retry が最初の consumer)
nostos = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Async utilities
futures = { workspace = true }
tokio-util = "0.7"

# Unicode 正規化（ペースト sanitize 用、NFD → NFC）
unicode-normalization = "0.1"

# URL encoding (msg_directory project_name パラメータ用)
urlencoding = "2"

# HTTP client (for MCP to communicate with Process)
reqwest = { workspace = true }

# MCP (Model Context Protocol)
rmcp = { version = "1.7", features = ["server", "transport-io"] }
schemars = "1"

# QUIC protocol (crates.io package = club-unison、 Rust 識別子 = unison。 VP-185 で alias)
unison = { workspace = true }

# GUI stack (feature = "gui" 有効時のみ有効化)
tao = { version = "0.35", optional = true }
muda = { version = "0.19", optional = true }
tray-icon = { version = "0.24", optional = true }

# Open URLs in system browser (= 既存、 別 module の URL open に利用中)
open = "5"

# Phase A2b (= dogfood 10): vp auth login の OAuth Native App + PKCE flow 用。
# user 判断で webbrowser を採用 (= 業界 default、 既存 `open` とは別の責務として並立)。
# sha2 / rand / url は PKCE / state / token exchange body 構築用、 vp-nexus A1c (PR #473)
# で同じ deps を入れて A1c removal (PR #475) で外した経緯あり、 今度は vp-cli 側に着地する
# (= RFC 8252 推奨の client-side path、 nexus は介在しない)。
# base64 は別 line で既に dep 済 (= 共通利用)。
sha2 = "0.11"
rand = "0.10"
url = "2"
webbrowser = "1"

# Configuration
toml = "1.1"
dirs = "6"

# Log file writer + ローテーション (Win GUI subsystem では stderr が NUL 化されるので、
# `VP_DAEMON_LOG_FILE` env が指定された時に file に直接書く)。
# file-rotate: 容量/件数ベースのローテーション、 現行ファイルは bare 名 (daemon.kdl.log) 維持。
file-rotate = "0.8"

# MIDI input (feature = "midi" 有効時のみ、ALSA 依存回避のため optional)
midir = { version = "0.11", optional = true }
# ROTO parameter learn の hash6 (SHA-1 先頭 6 byte、doc 20 §3) 用
sha1 = { version = "0.10", optional = true }

# UUID generation (v7 for time-ordered Event ids; serde for wire format)
uuid = { version = "1", features = ["v4", "v7", "serde"] }

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# Hostname
hostname = "0.4"
libc = "0.2.186"

# Low-level socket control (IPV6_V6ONLY=0 を Windows でも明示設定するために必要。
# tokio::net::TcpSocket には set_only_v6 が無いので socket2 経由で setsockopt する)
socket2 = { version = "0.6", features = ["all"] }

# TLS (QUIC サーバーの CryptoProvider 初期化用)
rustls = { version = "0.23", features = ["aws-lc-rs"] }

# PTY (pseudo-terminal) for shell sessions
portable-pty = "0.9"

# Base64 encoding (for PTY binary I/O over WebSocket)
base64 = "0.22"

# WebSocket client (for Canvas Lane bridge to other Processes)
tokio-tungstenite = "0.29"

# File system watcher (for trace log → WebSocket broadcast)
notify = "8"

# Regex (for log level filtering in file watcher)
regex = "1"

# Phase L7d: rusqlite dep 削除 — ccwire.rs 除去で不要に
# (msgbox / Mailbox は SurrealDB に統一)
# rusqlite = { workspace = true }

# SurrealDB (VP-172 merge: 旧 vp-db crate を本 crate に物理 merge、 src/db/ module)
# 経緯: hyperfine 計測で vp-db touch 時の cascade compile = 3m 31s、 module 内なら ~15s 想定
surrealdb = { workspace = true }

# Terminal emulation (VT parser + grid state)
alacritty_terminal = "0.26"
vte = "0.15"

# TUI framework
ratatui = { workspace = true }
crossterm = { workspace = true }

# TUI Canvas extensions
tui-markdown = "0.3"
tui-scrollview = "0.6"
ratatui-image = { version = "11", default-features = false, features = ["crossterm", "image-defaults"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# macOS native APIs (split window, NSView for terminal pane)
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSString",
    "NSGeometry",
    "NSAttributedString",
    "NSDictionary",
    "NSObject",
    "NSNotification",
    "NSDistributedNotificationCenter",
] }
objc2-app-kit = { version = "0.3", features = [
    "NSResponder",
    "NSView",
    "NSColor",
    "NSWindow",
    "NSText",
    "NSTextView",
    "NSScrollView",
    "NSClipView",
    "NSFont",
    "NSFontDescriptor",
    "NSAttributedString",
    "NSGraphics",
    "NSGraphicsContext",
    "NSStringDrawing",
    "objc2-core-foundation",
    "objc2-core-graphics",
] }
objc2-core-foundation = "0.3"
objc2-core-graphics = { version = "0.3", features = ["CGColor", "CGContext"] }

# Windows native APIs (screenshot backend: EnumWindows + PrintWindow + GDI)
# Note: PrintWindow / PRINT_WINDOW_FLAGS は 0.61 で `Win32::Storage::Xps` 配下にある
# (Win32 metadata の API set 分類による。 Print = 印刷 API group)
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_Storage_Xps",
] }

[dev-dependencies]
tempfile = "3.27.0"
# VP-13 sub-scope E: Medium 層 route test 用 (= Axum oneshot pattern、 ServiceExt::oneshot)
tower = { workspace = true, features = ["util"] }
# hub_client_e2e: 本番 vp バイナリと同じ rustls CryptoProvider をテストプロセスで install するため
rustls = { version = "0.23", features = ["aws-lc-rs"] }
