<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VP Brand Studio</title>
<link rel="stylesheet" href="./studio.css"></head><body>
<header><div><span class="eyebrow">VANTAGE POINT / BRAND STUDIO</span><h1>色が見える、輪郭へ。</h1><p>白い線の太さを調整して、山と太陽の色を引き出す。</p></div><div class="actions"><button id="import">SVGを開く</button><button id="export" class="primary" disabled>SVGを保存</button><input type="file" id="file" accept=".svg,image/svg+xml" hidden></div></header>
<main><section class="canvas"><div class="comparison"><figure><figcaption><span>01 / CURRENT</span><strong>現行</strong></figcaption><img id="original" alt="現行のアプリアイコン"></figure><figure><figcaption><span>02 / EDITING</span><strong>調整中</strong></figcaption><img id="edited" alt="調整中のアプリアイコン"></figure></div><div class="scale-row"><div><span class="eyebrow">ACTUAL SIZE</span><p>小さな表示でも、色が残るか。</p></div><div id="sizes"></div></div><div class="mark-row"><span>背景なし</span><img id="mark" alt="背景なしの調整中ロゴ"></div></section>
<aside><div class="aside-head"><h2>ロゴを調整</h2><span>256 × 256 基準</span></div><div class="presets"><button id="color-first" class="selected">色を広く見せる</button><button id="reset">現行に戻す</button></div><div id="controls"></div><label class="select-row" for="join">外周の角<select id="join"><option value="round">丸い</option><option value="bevel">面取り</option><option value="miter">鋭い</option></select></label><label class="select-row" for="white">線の色<input type="color" id="white" value="#edeef5"></label><div id="colors"></div><p class="hint">外周を細くすると山の色面が広がります。中央・雪・太陽は、それぞれ別に調整できます。</p><p id="status" role="status">ロゴを読み込み中…</p></aside></main>
<footer>調整値はSVGに保存されます。「SVGを開く」で続きから編集できます。</footer><script type="module" src="./studio.mjs"></script></body></html>
