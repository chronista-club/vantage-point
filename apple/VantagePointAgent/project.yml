# VantagePointAgent — VP macOS menu bar agent (XcodeGen repo 定義)。
#
# doc 25 §4 / doc 26: Apple Platform Architecture の Model D。
# daemon = Mac 常駐 (Rust + club-unison server)、 各 surface は Unison/QUIC で繋がる
# native client。 この agent は「OS と握手する手」= Cocoa main run loop を保持して
# CoreMIDI hot-plug を native 検出 → Unison wire で daemon に報告する (FFI 無し)。
#
# repo.yml が SSOT。 .xcodeproj / Generated/ は `xcodegen generate` の生成物 (git ignore)。
name: VantagePointAgent

options:
  bundleIdPrefix: club.chronista.vp
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

packages:
  # club-unison の Swift client SDK（product 名 `UnisonClient`）。sibling repo の local path 依存
  # (creoui と同じ sibling 前提。 将来 独立 repo 化 or submodule も選択肢)
  #
  # ⚠️ 2026-07-22 修正: upstream が `Package.swift` を **repo root へ移動**した
  # （旧: `clients/swift/Package.swift`）ため、旧 path では
  # `the package manifest at '.../clients/swift/Package.swift' cannot be accessed` で
  # xcodebuild が落ちていた。xcodegen は通るので**生成までは成功して build で初めて落ちる**。
  UnisonClient:
    path: ../../../club-unison

targets:
  VantagePointAgent:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Sources
    dependencies:
      - package: UnisonClient
        product: UnisonClient
    # Info.plist は properties から生成する (repo.yml に集約)。 生成先は git ignore。
    info:
      path: Generated/Info.plist
      properties:
        LSUIElement: true                 # dock icon 無し = menu bar のみの agent
        CFBundleDisplayName: Vantage Point Agent
        CFBundleName: VantagePointAgent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: club.chronista.vp.agent
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: "NO"     # info.path を使うので Xcode 自動生成は切る
        CODE_SIGN_STYLE: Automatic
    # XcodeGen に shared scheme を生成させる (`xcodebuild -scheme VantagePointAgent` 用)。
    scheme: {}
