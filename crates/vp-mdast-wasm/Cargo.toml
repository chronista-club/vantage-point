[package]
name = "vp-mdast-wasm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "VP mdast WASM バインディング — Canvas 内で Markdown パース (creo-md backed)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# 2026-05-01: vp-mdast (alias) ではなく creo-md を直接 dep に。 wasm-bindgen 周りはここで保持
creo-md = { git = "https://github.com/chronista-club/creo-views" }
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
serde_json = { workspace = true }
