[package]
name = "vp-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Vantage Point CLI — AI ネイティブ開発環境の CLI エントリーポイント"

[[bin]]
name = "vp"
path = "src/main.rs"

[lib]
name = "vp_cli"
path = "src/lib.rs"

[features]
default = ["gui", "midi"]
gui = ["vantage-point/gui"]
midi = ["vantage-point/midi"]

[dependencies]
vantage-point = { path = "../vantage-point", default-features = false }
clap = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
rustls = { version = "0.23", features = ["aws-lc-rs"] }
# VP-69 lane Phase 2: wing actor を TheWorld に register/unregister
reqwest = { workspace = true }
serde_json = { workspace = true }
# Phase 4-X: lane lib は vantage-point に移動済、 vp-cli から直 deps は不要
# (vantage-point 経由で transitively 利用)

[dev-dependencies]
# VP-13 sub-scope B: vp-cli smoke test 用 (= `vp` binary を起動して assert)
assert_cmd = "2"
predicates = "3"
tempfile = "3.27.0"
